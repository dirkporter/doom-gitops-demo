# Python/Flask API that the DOOM container POSTs to on level completion,
# which writes a row into PostgreSQL on the VM.
#
# KEY FIXES vs. the original:
#  - Original wrote app.py into "/" and pip-installed into system
#    site-packages at startup. Under OpenShift's default restricted-v2 SCC the
#    container runs as a random non-root UID that can write to NEITHER, so it
#    crash-looped. Here the code is delivered read-only via a ConfigMap mounted
#    at /opt/app, and dependencies install into /tmp (always writable).
#  - Added /healthz (used by a startupProbe so the pod isn't marked ready until
#    pip install + Flask are up) and /scores (handy for showing the leaderboard
#    in the demo).
#
# NOTE: pip install at startup needs egress to PyPI. For a build-once image
# instead, see build/ and swap the container image + command (README).
apiVersion: v1
kind: ConfigMap
metadata:
  name: doom-api-code
  namespace: doom-demo
data:
  app.py: |
    from flask import Flask, request, jsonify
    import psycopg2
    import os

    app = Flask(__name__)
    DB_HOST = os.getenv("DB_HOST", "doom-db-service")
    DB_NAME = os.getenv("DB_NAME", "doom_stats")
    DB_USER = os.getenv("DB_USER", "doom_admin")
    DB_PASS = os.getenv("DB_PASSWORD", "doom_password")

    def get_db_connection():
        return psycopg2.connect(host=DB_HOST, database=DB_NAME, user=DB_USER, password=DB_PASS)

    @app.route('/healthz', methods=['GET'])
    def healthz():
        return jsonify({"status": "ok"}), 200

    @app.route('/level-complete', methods=['POST'])
    def level_complete():
        data = request.get_json(force=True, silent=True) or {}
        player_id = data.get('player_id', 'anonymous')
        level = data.get('level')
        seconds = data.get('time_seconds')
        if not level or seconds is None:
            return jsonify({"status": "error", "message": "Missing level or time_seconds"}), 400
        conn = get_db_connection()
        cur = conn.cursor()
        cur.execute(
            'INSERT INTO level_times (player_id, level_name, completion_time_seconds) VALUES (%s, %s, %s)',
            (player_id, level, seconds)
        )
        conn.commit()
        cur.close()
        conn.close()
        return jsonify({"status": "success", "player_id": player_id}), 200

    @app.route('/scores', methods=['GET'])
    def scores():
        conn = get_db_connection()
        cur = conn.cursor()
        cur.execute('SELECT player_id, level_name, completion_time_seconds, recorded_at '
                    'FROM level_times ORDER BY recorded_at DESC LIMIT 50')
        rows = cur.fetchall()
        cur.close()
        conn.close()
        return jsonify([
            {"player_id": r[0], "level": r[1], "time_seconds": r[2], "recorded_at": str(r[3])}
            for r in rows
        ]), 200

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom-api
  namespace: doom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doom-api
  template:
    metadata:
      labels:
        app: doom-api
    spec:
      containers:
        - name: api
          image: python:3.9-slim
          workingDir: /tmp
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              export HOME=/tmp
              pip install --no-cache-dir --target=/tmp/site-packages flask psycopg2-binary
              export PYTHONPATH=/tmp/site-packages
              exec python /opt/app/app.py
          env:
            - name: DB_HOST
              value: "doom-db-service"
            - name: DB_NAME
              value: "doom_stats"
            - name: DB_USER
              value: "doom_admin"
            - name: DB_PASSWORD
              value: "doom_password"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app-code
              mountPath: /opt/app
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
      volumes:
        - name: app-code
          configMap:
            name: doom-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: doom-api-service
  namespace: doom-demo
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: doom-api
