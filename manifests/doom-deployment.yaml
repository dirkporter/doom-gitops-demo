apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom-game
  namespace: doom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doom-game
  template:
    metadata:
      labels:
        app: doom-game
    spec:
      containers:
        - name: doom
          image: ghcr.io/greg-jones/web-doom:latest
          ports:
            - containerPort: 8080
          env:
            - name: DOOM_API_URL
              value: "http://doom-api-service.doom-demo.svc.cluster.local/level-complete"
---
apiVersion: v1
kind: Service
metadata:
  name: doom-game-service
  namespace: doom-demo
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: doom-game
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: doom-web
  namespace: doom-demo
spec:
  to:
    kind: Service
    name: doom-game-service
  port:
    targetPort: 8080
