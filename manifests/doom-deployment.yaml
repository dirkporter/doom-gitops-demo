# The DOOM game container, exposed via a Route.
#
# KEY FIX vs. the original: the Route's port.targetPort pointed at 8080, but a
# Route must reference the SERVICE's port, which is 80. The service port is now
# named "http" and the Route references it by name (robust against future
# changes). The mismatch would otherwise surface as a 503 from the router.
#
# IMPORTANT - IMAGE CONTRACT: ghcr.io/greg-jones/web-doom:latest is a
# PLACEHOLDER. For the end-to-end demo to record times, the image must:
#   1) read the DOOM_API_URL env var, and
#   2) HTTP POST application/json {"player_id": "...", "level": "...",
#      "time_seconds": <int>} to it when a level is completed.
# No stock browser-DOOM image does this - you need a build with that hook.
# Until then, use test/smoke-test.sh (see README) to prove the API->DB path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom-game
  namespace: doom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doom-game
  template:
    metadata:
      labels:
        app: doom-game
    spec:
      containers:
        - name: doom
          image: quay.io/knav3/doom-gitops.demo:latest  # <-- replace with an image that POSTs to DOOM_API_URL
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          
---
apiVersion: v1
kind: Service
metadata:
  name: doom-game-service
  namespace: doom-demo
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: doom-game
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: doom-web
  namespace: doom-demo
spec:
  to:
    kind: Service
    name: doom-game-service
  port:
    targetPort: http
