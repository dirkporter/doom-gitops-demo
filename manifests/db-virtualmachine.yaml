# PostgreSQL on a VM via OpenShift Virtualization.
#
# KEY FIX vs. the original: the VM now has a pod-network interface. The
# original defined no interfaces/networks, so the VM booted with NO NIC -
# cloud-init could not reach dnf repos to install PostgreSQL, and the Service
# could never reach the database. With masquerade binding and no explicit
# port list, all ports (including 5432) are forwarded into the VM.
#
# Also: runStrategy: Always replaces the deprecated spec.running: true.
#
# NOTE ON PERSISTENCE: this boots from an ephemeral containerDisk, so the
# database is rebuilt from cloud-init on every VM restart (fine for a demo,
# the rows you record are lost on reboot). For persistence, swap to a
# DataVolume/PVC-backed boot disk - see README.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: doom-db-vm
  namespace: doom-demo
  labels:
    app: doom-db
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: doom-db-vm
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/centos-stream:9
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: admin
              password: Password123
              chpasswd: { expire: False }
              ssh_pwauth: True
              packages:
                - postgresql-server
                - postgresql-contrib
              runcmd:
                - postgresql-setup --initdb
                - sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/g" /var/lib/pgsql/data/postgresql.conf
                - echo "host all all 0.0.0.0/0 md5" >> /var/lib/pgsql/data/pg_hba.conf
                - systemctl enable --now postgresql
                - sudo -u postgres psql -c "CREATE USER doom_admin WITH PASSWORD 'doom_password';"
                - sudo -u postgres psql -c "CREATE DATABASE doom_stats OWNER doom_admin;"
                - sudo -u postgres psql -d doom_stats -c "CREATE TABLE IF NOT EXISTS level_times (id SERIAL PRIMARY KEY, player_id VARCHAR(100), level_name VARCHAR(50), completion_time_seconds INT, recorded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
                - sudo -u postgres psql -d doom_stats -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO doom_admin;"
                - sudo -u postgres psql -d doom_stats -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO doom_admin;"
---
apiVersion: v1
kind: Service
metadata:
  name: doom-db-service
  namespace: doom-demo
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    kubevirt.io/domain: doom-db-vm
