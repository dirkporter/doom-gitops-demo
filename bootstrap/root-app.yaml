apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doom-demo-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/<your-username>/doom-gitops-demo.git' # UPDATE THIS
    targetRevision: HEAD
    path: manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: doom-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
